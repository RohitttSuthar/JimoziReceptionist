<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Customer Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/index.css">
</head>
<body>

<main class="home" id="home">
  <div class="brand-heading">
    <img class="brand-logo" src="/static/logo.png" alt="Jimozi logo" width="56" height="56">
    <div>
      <h1>Customer Support</h1>
      <p class="lead">Talk to our team. We’re here to help.</p>
    </div>
  </div>
  <div class="call-wrap">
    <div class="mode-switch" role="group" aria-label="Choose receptionist mode">
      <button type="button" class="mode-option" id="consumerMode" aria-pressed="true">CONSUMER</button>
      <button type="button" class="mode-option" id="chefMode" aria-pressed="false">CHEF</button>
    </div>
    <p class="mode-hint" id="modeHint">Customer questions: menu, pricing, orders and delivery</p>
    <div class="support-actions">
      <button type="button" class="support-option call-option" id="callBtn" aria-label="Call customer support">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>Tap to call</span>
      </button>
      <button type="button" class="support-option chat-option" id="openChatBtn" aria-label="Chat with customer support">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
        <span>Tap to chat</span>
      </button>
    </div>
    <p class="note" id="homeNote" role="status" aria-live="polite"></p>
  </div>
</main>

<section class="chat-panel" id="chatPanel" role="dialog" aria-modal="true" aria-label="Customer support chat" aria-hidden="true">
  <header class="chat-header">
    <div class="chat-header-copy">
      <span class="chat-title" id="chatTitle">Consumer Support</span>
      <span class="chat-brand" id="chatBrand"></span>
    </div>
    <div class="chat-header-actions">
      <button type="button" class="chat-voice-btn" id="chatVoiceBtn" aria-label="Switch to voice call">Call</button>
      <button type="button" class="chat-close-btn" id="closeChatBtn" aria-label="Close chat">×</button>
    </div>
  </header>
  <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions text">
    <div class="chat-welcome" id="chatWelcome">नमस्ते! मैं आपकी कैसे मदद कर सकती हूँ?</div>
  </div>
  <form class="chat-composer" id="chatForm">
    <label class="sr-only" for="chatInput">Type your message</label>
    <textarea id="chatInput" name="message" rows="1" maxlength="1000" placeholder="अपना संदेश लिखें…" required></textarea>
    <button type="submit" id="chatSendBtn" aria-label="Send message">Send</button>
  </form>
  <p class="chat-footnote" id="chatStatus" role="status" aria-live="polite">आप चैट या वॉइस कॉल के बीच स्विच कर सकते हैं।</p>
</section>

<section class="call" id="call" role="dialog" aria-modal="true" aria-label="Customer support call">
  <div class="call-top">
    <div><span class="who" id="who">Consumer Support</span><span class="brand" id="brand"></span></div>
    <span class="timer" id="timer">0:00</span>
  </div>
  <div class="stage">
    <canvas id="orb" aria-hidden="true"></canvas>
    <div class="status" id="status" role="status" aria-live="polite">Connecting…</div>
  </div>
  <div class="call-foot">
    <button class="end-btn" id="endBtn" aria-label="End call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92z"/></svg>
    </button>
    <span class="end-label">End call</span>
  </div>
</section>

<script src="/static/index.js" defer></script>
</body>
</html>
