<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Customer Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/index.css">
</head>
<body>

<main class="home" id="home">
  <div>
    <h1>Customer Support</h1>
    <p class="lead">Talk to our team. We’re here to help.</p>
  </div>
  <div class="call-wrap">
    <div class="mode-switch" role="group" aria-label="Choose receptionist mode">
      <button type="button" class="mode-option" id="consumerMode" aria-pressed="true">CONSUMER</button>
      <button type="button" class="mode-option" id="chefMode" aria-pressed="false">CHEF</button>
    </div>
    <p class="mode-hint" id="modeHint">Customer questions: menu, pricing, orders and delivery</p>
    <button class="call-btn" id="callBtn" aria-label="Call customer support">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92z"/></svg>
    </button>
    <span class="call-label">Tap to call</span>
    <p class="note" id="homeNote" role="status" aria-live="polite"></p>
  </div>
</main>

<section class="call" id="call" role="dialog" aria-modal="true" aria-label="Customer support call">
  <div class="call-top">
    <div><span class="who" id="who">Consumer Support</span><span class="brand" id="brand"></span></div>
    <span class="timer" id="timer">0:00</span>
  </div>
  <div class="stage">
    <canvas id="orb" aria-hidden="true"></canvas>
    <div class="status" id="status" role="status" aria-live="polite">Connecting…</div>
  </div>
  <div class="call-foot">
    <button class="end-btn" id="endBtn" aria-label="End call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92z"/></svg>
    </button>
    <span class="end-label">End call</span>
  </div>
</section>

<script src="/static/index.js" defer></script>
</body>
</html>
